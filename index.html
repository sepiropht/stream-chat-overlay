<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Chat</title>
  <style>
    :root {
      --bg-bar:  rgba(8, 8, 14, 0.88);
      --bg-msg:  rgba(0, 0, 0, 0.58);
      --bg-inp:  rgba(255,255,255,0.07);
      --border:  rgba(255,255,255,0.08);
      --text:    #e8e8e8;
      --dim:     #777;
      --twitch:  #9147ff;
      --youtube: #ff3030;
      --green:   #22c55e;
      --accent:  #5c5c9e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:#0d0d12; color:var(--text); font-family:'Noto Color Emoji',system-ui,-apple-system,sans-serif; font-size:13px; overflow:hidden; }
    #app { height:100vh; display:flex; flex-direction:column; }

    /* ── Header ── */
    #header {
      display:flex; align-items:center; justify-content:space-between;
      padding:6px 10px; background:var(--bg-bar); border-bottom:1px solid var(--border);
      flex-shrink:0; -webkit-app-region:drag; user-select:none;
      backdrop-filter: blur(6px);
    }
    #hd-left { display:flex; align-items:center; gap:10px; font-weight:600; font-size:12px; letter-spacing:.4px; }
    .si { display:flex; align-items:center; gap:4px; }
    .dot { width:7px; height:7px; border-radius:50%; background:#444; transition:background .3s; }
    .dot.on-tw { background:var(--twitch); }
    .dot.on-yt { background:var(--youtube); }
    .viewers { font-size:11px; font-weight:700; color:#aaa; min-width:24px; }
    #hd-right { display:flex; gap:2px; -webkit-app-region:no-drag; }
    .btn { background:none; border:none; color:var(--dim); cursor:pointer; padding:4px 7px; border-radius:4px; font-size:14px; line-height:1; transition:background .12s,color .12s; }
    .btn:hover { background:var(--bg3); color:var(--text); }

    /* ── Messages ── */
    #messages {
      flex:1; overflow-y:auto; overflow-x:hidden;
      padding:6px 8px; display:flex; flex-direction:column; gap:3px;
      background: transparent;
    }
    #messages::-webkit-scrollbar { width:3px; }
    #messages::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }

    .msg {
      display:flex; align-items:baseline; gap:5px; flex-wrap:wrap;
      padding:3px 5px; border-radius:3px; line-height:1.45;
      animation:fadein .18s ease;
    }
    @keyframes fadein { from{opacity:0;transform:translateX(-4px)} to{opacity:1;transform:translateX(0)} }
    .msg:hover { background:rgba(255,255,255,.04); }

    .badge {
      font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px;
      color:#fff; flex-shrink:0; align-self:center; letter-spacing:.3px;
    }
    .badge-tw { background:var(--twitch); }
    .badge-yt { background:var(--youtube); }

    .msg-user { font-weight:600; flex-shrink:0; }
    .msg-sep  { color:var(--dim); flex-shrink:0; }
    .msg-text { color:#ccc; word-break:break-word; overflow-wrap:anywhere; }

    #empty {
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:8px; color:var(--dim); font-size:12px; text-align:center;
    }
    #empty .ico { font-size:32px; }

    #yt-error {
      margin:4px 8px; padding:6px 10px; background:#3a1010; border:1px solid #6a2020;
      border-radius:4px; font-size:11px; color:#ff9999; display:none;
    }

    /* ── Quick bar ── */
    #quickbar {
      display:flex; align-items:center; gap:6px; padding:5px 8px;
      background:var(--bg-bar); border-top:1px solid var(--border); flex-shrink:0;
      backdrop-filter: blur(6px);
    }
    #quickbar label { font-size:10px; color:var(--dim); flex-shrink:0; }
    #yt-input {
      flex:1; background:var(--bg-inp); border:1px solid var(--border); border-radius:3px;
      color:var(--text); padding:3px 6px; font-size:11px; font-family:monospace; outline:none;
    }
    #yt-input:focus { border-color:var(--youtube); }
    #yt-go {
      background:var(--youtube); border:none; color:#fff; padding:3px 9px;
      border-radius:3px; cursor:pointer; font-size:11px; font-family:inherit;
    }
    #yt-go:hover { opacity:.85; }

    /* ── Settings ── */
    #settings {
      display:none; flex-direction:column; gap:10px; padding:12px;
      background:rgba(8,8,20,0.95); border-top:2px solid var(--accent); flex-shrink:0;
      backdrop-filter: blur(8px);
    }
    #settings.open { display:flex; }
    .s-row { display:flex; gap:12px; }
    .s-group { flex:1; display:flex; flex-direction:column; gap:6px; }
    .s-title { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.4px; }
    .s-field { display:flex; flex-direction:column; gap:3px; }
    .s-field span { font-size:10px; color:var(--dim); }
    .s-field input {
      background:var(--bg-inp); border:1px solid var(--border); border-radius:3px;
      color:var(--text); padding:4px 7px; font-size:12px; font-family:inherit; outline:none;
    }
    .s-field input:focus { border-color:var(--accent); }
    .s-footer { display:flex; align-items:center; justify-content:flex-end; gap:10px; }
    .s-saved { font-size:11px; color:var(--green); opacity:0; transition:opacity .2s; }
    .s-saved.show { opacity:1; }
    #s-save {
      background:var(--accent); border:none; color:#fff; padding:5px 14px;
      border-radius:4px; cursor:pointer; font-size:12px; font-family:inherit;
    }
    #s-save:hover { background:#7070b0; }

    #msg-count { margin-left:auto; font-size:10px; color:#333; }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <div id="hd-left">
      <div class="si">
        <span class="dot" id="dot-tw"></span>
        <span style="color:var(--twitch);font-size:11px">TW</span>
        <span class="viewers" id="viewers-tw"></span>
      </div>
      <div class="si">
        <span class="dot" id="dot-yt"></span>
        <span style="color:var(--youtube);font-size:11px">YT</span>
        <span class="viewers" id="viewers-yt"></span>
      </div>
      <span style="color:var(--dim)">chat</span>
    </div>
    <div id="hd-right">
      <span id="msg-count">0</span>
      <button class="btn" id="btn-sound" title="Son">🔔</button>
      <button class="btn" id="btn-clear" title="Effacer">🗑</button>
      <button class="btn" id="btn-settings" title="Paramètres">⚙</button>
    </div>
  </div>

  <div id="yt-error"></div>

  <div id="messages">
    <div id="empty">
      <div class="ico">💬</div>
      <div>Configure via ⚙ pour démarrer</div>
    </div>
  </div>

  <div id="quickbar">
    <label>YT Video ID :</label>
    <input id="yt-input" type="text" placeholder="ex: dQw4w9WgXcQ" spellcheck="false">
    <button id="yt-go">▶</button>
  </div>

  <div id="settings">
    <div class="s-row">
      <div class="s-group">
        <div class="s-title"><span style="color:var(--twitch)">●</span> Twitch</div>
        <div class="s-field">
          <span>Nom de chaîne</span>
          <input id="s-twitch" type="text" placeholder="ta_chaine">
        </div>
        <div class="s-field">
          <span>Client ID <span style="color:#555">(dev.twitch.tv)</span></span>
          <input id="s-tw-clientid" type="text" placeholder="abc123...">
        </div>
        <div class="s-field">
          <span>Client Secret</span>
          <input id="s-tw-secret" type="password" placeholder="••••••••">
        </div>
      </div>
      <div class="s-group">
        <div class="s-title"><span style="color:var(--youtube)">●</span> YouTube</div>
        <div class="s-field">
          <span>Clé API (YouTube Data v3)</span>
          <input id="s-apikey" type="password" placeholder="AIza...">
        </div>
        <div class="s-field">
          <span>Video ID du live</span>
          <input id="s-ytid" type="text" placeholder="dQw4w9WgXcQ" spellcheck="false">
        </div>
      </div>
    </div>
    <div class="s-footer">
      <span class="s-saved" id="s-saved">✓ Sauvegardé</span>
      <button id="s-save">Sauvegarder</button>
    </div>
  </div>

</div>
<script>
  let config = { twitch:{ channel:'', clientId:'', clientSecret:'' }, youtube:{ apiKey:'', videoId:'' } };
  let msgCount = 0;
  let autoScroll = true;

  const msgs      = document.getElementById('messages');
  const empty     = document.getElementById('empty');
  const dotTw     = document.getElementById('dot-tw');
  const dotYt     = document.getElementById('dot-yt');
  const ytErr     = document.getElementById('yt-error');
  const ytInput   = document.getElementById('yt-input');
  const settings  = document.getElementById('settings');
  const msgCountEl= document.getElementById('msg-count');

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(n){ return n >= 1000 ? (n/1000).toFixed(1).replace('.0','') + 'k' : String(n); }

  // ── WebSocket ────────────────────────────────────────────────────────────────
  let ws;
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onmessage = ({ data }) => {
      const d = JSON.parse(data);
      if (d.type === 'config')  { applyConfig(d.data); return; }
      if (d.type === 'status')  { updateStatus(d); return; }
      if (d.type === 'viewers') { updateViewers(d); return; }
      if (d.type === 'saved')   { showSaved(); return; }
      if (d.type === 'yt_error'){ showYtError(d.message); return; }
      if (d.type === 'msg')     { addMsg(d); }
    };
  }

  // ── Config ───────────────────────────────────────────────────────────────────
  function applyConfig(c) {
    config = c;
    document.getElementById('s-twitch').value       = c.twitch.channel || '';
    document.getElementById('s-tw-clientid').value  = c.twitch.clientId || '';
    document.getElementById('s-tw-secret').value    = c.twitch.clientSecret || '';
    document.getElementById('s-apikey').value       = c.youtube.apiKey || '';
    document.getElementById('s-ytid').value         = c.youtube.videoId || '';
    ytInput.value = c.youtube.videoId || '';
  }

  function updateViewers({ twitch, youtube }) {
    const tw = document.getElementById('viewers-tw');
    const yt = document.getElementById('viewers-yt');
    tw.textContent = twitch > 0 ? fmt(twitch) : '';
    yt.textContent = youtube > 0 ? fmt(youtube) : '';
  }

  function updateStatus({ twitch, youtube }) {
    dotTw.className = 'dot' + (twitch  ? ' on-tw' : '');
    dotYt.className = 'dot' + (youtube ? ' on-yt' : '');
    if (youtube) ytErr.style.display = 'none';
  }

  function showYtError(msg) {
    ytErr.textContent = '⚠ YouTube : ' + msg;
    ytErr.style.display = 'block';
  }

  // ── Son ──────────────────────────────────────────────────────────────────────
  let soundEnabled = false;
  let audioCtx = null;

  function playPop() {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new AudioContext();
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.12);
    } catch {}
  }

  const btnSound = document.getElementById('btn-sound');
  btnSound.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    btnSound.textContent = soundEnabled ? '🔔' : '🔕';
    // Débloquer l'AudioContext au premier clic
    if (soundEnabled && !audioCtx) { audioCtx = new AudioContext(); playPop(); }
  });

  // ── Emotes Twitch + emoji ─────────────────────────────────────────────────────
  function renderMessage(message, emotes) {
    // Pas d'emotes → simple escape (emoji Unicode passent tels quels)
    if (!emotes) return esc(message);

    // Parse "id:start-end,start-end/id:start-end" → liste de substitutions
    const subs = [];
    for (const part of emotes.split('/')) {
      const colon = part.indexOf(':');
      if (colon < 0) continue;
      const id  = part.slice(0, colon);
      for (const range of part.slice(colon + 1).split(',')) {
        const [s, e] = range.split('-').map(Number);
        subs.push({ id, s, e });
      }
    }
    subs.sort((a, b) => a.s - b.s);

    // Construire le HTML en intercalant <img> aux positions des emotes
    let html = '';
    let pos  = 0;
    for (const { id, s, e } of subs) {
      if (s > pos) html += esc(message.slice(pos, s));
      const name = esc(message.slice(s, e + 1));
      html += `<img src="https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/1.0" alt="${name}" title="${name}" style="height:1.5em;vertical-align:middle;margin:0 1px">`;
      pos = e + 1;
    }
    if (pos < message.length) html += esc(message.slice(pos));
    return html;
  }

  // ── Messages ─────────────────────────────────────────────────────────────────
  function addMsg({ platform, username, message, color, emotes }) {
    try {
      if (empty.parentNode === msgs) msgs.removeChild(empty);

      const el = document.createElement('div');
      el.className = 'msg';
      const c = (color && color !== '#000000') ? color : (platform === 'twitch' ? '#9147ff' : '#ff3030');

      let msgHtml;
      try {
        msgHtml = renderMessage(message, emotes);
      } catch {
        msgHtml = esc(message);   // fallback texte brut si les emotes plantent
      }

      el.innerHTML =
        `<span class="badge badge-${platform === 'twitch' ? 'tw' : 'yt'}">${platform === 'twitch' ? 'TW' : 'YT'}</span>` +
        `<span class="msg-user" style="color:${esc(c)}">${esc(username || '?')}</span>` +
        `<span class="msg-sep">:</span>` +
        `<span class="msg-text">${msgHtml}</span>`;

      msgs.appendChild(el);
      if (autoScroll) msgs.scrollTop = msgs.scrollHeight;
      while (msgs.children.length > 500) msgs.removeChild(msgs.firstChild);

      msgCount++;
      msgCountEl.textContent = msgCount > 999 ? '999+' : String(msgCount);
      playPop();
    } catch (err) {
      console.error('addMsg error:', err, { platform, username, message });
    }
  }

  msgs.addEventListener('scroll', () => {
    autoScroll = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 60;
  });

  // ── Buttons ──────────────────────────────────────────────────────────────────
  document.getElementById('btn-settings').addEventListener('click', () => settings.classList.toggle('open'));

  document.getElementById('btn-clear').addEventListener('click', () => {
    msgs.innerHTML = ''; msgs.appendChild(empty);
    msgCount = 0; msgCountEl.textContent = '0';
  });

  document.getElementById('yt-go').addEventListener('click', () => {
    const vid = ytInput.value.trim();
    if (!vid) return;
    ytErr.style.display = 'none';
    ws.send(JSON.stringify({ type: 'update_video', videoId: vid }));
  });
  ytInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('yt-go').click(); });

  document.getElementById('s-save').addEventListener('click', () => {
    const c = {
      twitch:  {
        channel:      document.getElementById('s-twitch').value.trim(),
        clientId:     document.getElementById('s-tw-clientid').value.trim(),
        clientSecret: document.getElementById('s-tw-secret').value.trim(),
      },
      youtube: { apiKey: document.getElementById('s-apikey').value.trim(), videoId: document.getElementById('s-ytid').value.trim() },
    };
    ytInput.value = c.youtube.videoId;
    ytErr.style.display = 'none';
    ws.send(JSON.stringify({ type: 'save_config', config: c }));
  });

  function showSaved() {
    const el = document.getElementById('s-saved');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  connect();
</script>
</body>
</html>
